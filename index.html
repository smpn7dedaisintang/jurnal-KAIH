        function HabitList({ initialData, onSave, isReadOnly }) {
            const [data, setData] = React.useState({});
            const [expandedHabit, setExpandedHabit] = React.useState(null);
            const [showConfirm, setShowConfirm] = React.useState(false);

            React.useEffect(() => {
                const defaults = {};
                HABITS.forEach(h => {
                    defaults[h.id] = initialData[h.id] || { status: false, timeValue: '' };
                });
                setData(defaults);
            }, [initialData]);

            const toggleExpand = (id) => {
                setExpandedHabit(expandedHabit === id ? null : id);
            };

            const handleChange = (id, field, value) => {
                if (isReadOnly) return;
                
                const newData = {
                    ...data,
                    [id]: { ...data[id], [field]: value }
                };

                if (id === 'h1' && field === 'timeValue') { 
                    const [hours, mins] = value.split(':').map(Number);
                    const timeVal = hours + (mins/60);
                    newData[id].status = timeVal >= 4 && timeVal <= 6;
                }
                
                if (id === 'h7' && field === 'timeValue') { 
                    newData[id].status = value !== ''; 
                }

                setData(newData);
            };

            const triggerConfirm = () => {
                setShowConfirm(true);
            }

            const confirmSave = () => {
                setShowConfirm(false);
                onSave(data);
            };

            return (
                <div className="space-y-4">
                    {HABITS.map(habit => {
                        const itemData = data[habit.id] || { status: false, timeValue: '' };
                        const Icon = habit.icon;
                        const isExpanded = expandedHabit === habit.id;
                        
                        return (
                            <Card key={habit.id} className="p-4 transition-all hover:shadow-md">
                                <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                                    <div className={`p-3 rounded-xl bg-slate-50 ${habit.color}`}>
                                        <Icon />
                                    </div>
                                    <div className="flex-1 cursor-pointer" onClick={() => toggleExpand(habit.id)}>
                                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                            {habit.title}

                                    </div>
                                    
                                    <div className="flex items-center gap-4">
                                        {habit.type === 'time' && (
                                            <div className="flex flex-col items-end gap-1">
                                                <TimePicker24H 
                                                    value={itemData.timeValue}
                                                    onChange={(val) => handleChange(habit.id, 'timeValue', val)}
                                                    disabled={isReadOnly}
                                                />
                                            </div>
                                        )}
                                        
                                        <button
                                            disabled={isReadOnly || habit.type === 'time'}
                                            onClick={() => handleChange(habit.id, 'status', !itemData.status)}
                                            className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                                                itemData.status 
                                                ? 'bg-teal-500 text-white shadow-teal-200 shadow-lg scale-105' 
                                                : 'bg-slate-100 text-slate-300 hover:bg-slate-200'
                                            }`}
                                        >
                                            {itemData.status ? <Icons.CheckCircle /> : <div className="w-4 h-4 rounded-full border-2 border-slate-300" />}
                                        </button>
                                    </div>
                                </div>

                                {isExpanded && (
                                    <div className="mt-4 pt-3 border-t border-slate-100 bg-slate-50/50 -mx-4 -mb-4 p-4 rounded-b-xl animate-fade-in-down">
                                        <p className="text-xs font-bold text-slate-500 uppercase mb-2">Kegiatan:</p>

        function App() {
            if (!isConfigValid) {
                return <SetupInstruction />;
            }

            const [user, setUser] = React.useState(null);
            const [appUser, setAppUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [showWelcome, setShowWelcome] = React.useState(true);

            React.useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } catch (e) {
                            console.warn("Auth token gagal, mencoba anonymous...", e);
                            await auth.signInAnonymously();
                        }
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                
                initAuth().catch(e => console.error("Login Error:", e));

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="min-h-screen flex items-center justify-center">Memuat...</div>;
            if (!appUser) return (
                <>
                    {showWelcome && <WelcomeModal onClose={() => setShowWelcome(false)} />}
                    <LoginScreen onLogin={setAppUser} />
                </>
            );

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-20">
                    <header className="bg-white border-b sticky top-0 z-50 shadow-sm">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg" className="w-8 h-8 object-contain" />
                                <div>
                                    <h1 className="font-bold text-sm text-teal-700">Jurnal 7 KAIH</h1>
                                </div>
                            </div>
                            <button onClick={() => setAppUser(null)} className="p-2 text-slate-500 hover:text-teal-600 transition-colors"><Icons.LogOut/></button>
                        </div>
                    </header>
                    <main className="max-w-4xl mx-auto p-4">
                        {appUser.role === 'student' && <StudentDashboard user={appUser} firebaseUser={user} />}
                        {appUser.role === 'teacher' && <TeacherDashboard user={appUser} firebaseUser={user} />}
                        {appUser.role === 'parent' && <ParentDashboard user={appUser} firebaseUser={user} />}
                    </main>
                </div>
            );
        }

        function ParentDashboard({ user, firebaseUser }) {
             const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
             const [childLog, setChildLog] = React.useState(null);
             
             React.useEffect(() => {
                if (!firebaseUser || !user.childId) return;
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.childId}`).doc(date);
                
                docRef.onSnapshot(doc => {
                    if (doc.exists) {
                        setChildLog(doc.data());
                    } else {
                        setChildLog(null);
                    }
                });
             }, [firebaseUser, user.childId, date]);

             const handleSaveValidation = async (rating) => {
                 if (!user.childId) return;
                 if (childLog?.parentValidation) {
                     alert("Anda sudah memberikan validasi untuk tanggal ini.");
                     return;
                 }

                 const stickerInfo = VALIDATION_OPTIONS.find(v => v.value === rating);
                 
                 const dataToUpdate = {
                     parentValidation: {
                         rating: rating,
                         sticker: stickerInfo.icon,
                         timestamp: new Date().toISOString(),
                         parentName: user.name
                     }
                 };

                 await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.childId}`).doc(date).set(dataToUpdate, { merge: true });
                 
                 if (GOOGLE_SHEET_SCRIPT_URL && childLog) {
                     const sheetPayload = {
                         role: 'parent',
                         date: date,
                         studentName: childLog.studentName,
                         classId: childLog.classId,
                         parentValidation: dataToUpdate.parentValidation
                     };
                     
                     fetch(GOOGLE_SHEET_SCRIPT_URL, {
                         method: 'POST',
                         mode: 'no-cors',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify(sheetPayload)
                     }).catch(e => console.error("Sheet Error:", e));
                 }

                 alert(`Validasi Orang Tua: ${stickerInfo.label} diberikan!`);
             };

             return (
                <div className="space-y-6">
                  <div className="bg-gradient-to-br from-teal-500 to-yellow-400 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-48 h-48 bg-white/20 rounded-full -translate-y-1/3 translate-x-1/3 blur-3xl"></div>
                      <div className="absolute bottom-0 left-0 w-32 h-32 bg-yellow-600/20 rounded-full translate-y-1/3 -translate-x-1/3 blur-2xl"></div>
                      
                      <div className="relative z-10">
                        <h2 className="text-2xl font-bold text-shadow-sm mb-1">Portal Orang Tua</h2>
                        <p className="text-teal-50 text-sm font-medium opacity-90">Memantau: <span className="font-bold text-white">{user.name.replace('Ortu ', '')}</span></p>
                      </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 w-full">
                            <Icons.Calendar className="text-teal-500"/>
                            <span className="text-sm font-semibold text-slate-600 whitespace-nowrap">Tanggal:</span>
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)} 
                                className="bg-transparent outline-none font-bold text-slate-700 text-sm w-full"
                            />
                        </div>
                  </div>

                  {!childLog ? (
                      <div className="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300">
                          <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                              <Icons.BookOpen />
                          </div>
                          <p className="text-slate-500 font-bold text-lg">Belum ada jurnal</p>
                          <p className="text-sm text-slate-400">Anak belum mengisi jurnal pada tanggal ini.</p>
                      </div>
                  ) : (
                      <>
                          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-2 md:p-6">
                              <div className="flex items-center justify-between mb-6 px-2 border-b border-slate-100 pb-4">
                                <h3 className="font-bold text-lg text-slate-800">Isian Jurnal Anak</h3>
                                <div className="bg-teal-50 text-teal-700 px-3 py-1 rounded-lg text-sm font-bold border border-teal-100">
                                    Skor: {childLog.completionPercentage}%
                                </div>
                              </div>
                              <HabitList initialData={childLog} isReadOnly={true} />
                          </div>

                          <div className="bg-white rounded-3xl shadow-lg border border-teal-100 p-6 relative overflow-hidden">
                              <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-teal-400 to-yellow-300"></div>
                              
                              <div className="text-center mb-6">
                                  <h3 className="font-bold text-lg text-slate-800 mb-1">Validasi & Stiker</h3>
                                  <p className="text-sm text-slate-500">
                                      {childLog.parentValidation 
                                        ? "Terima kasih, Anda sudah memberikan validasi." 
                                        : "Berikan apresiasi untuk anak hari ini."}
                                  </p>
                              </div>
                              
                              {childLog.parentValidation && (
                                  <div className="mb-6 bg-green-50 p-4 rounded-2xl border border-green-200 text-center animate-fade-in-up">
                                      <p className="text-xs font-bold text-green-800 uppercase tracking-wider mb-2">Stiker yang diberikan</p>
                                      <span className="text-5xl drop-shadow-md">{childLog.parentValidation.sticker}</span>
                                  </div>
                              )}

                              <div className="grid grid-cols-2 gap-3">
                                  {VALIDATION_OPTIONS.map((opt) => {
                                      const isSelected = childLog.parentValidation?.rating === opt.value;
                                      const isDisabled = !!childLog.parentValidation; 
                                      
                                      return (
                                          <button
                                              key={opt.value}
                                              disabled={isDisabled}
                                              onClick={() => handleSaveValidation(opt.value)}
                                              className={`p-4 rounded-2xl border-2 flex flex-col items-center gap-2 transition-all ${
                                                  !isDisabled ? 'active:scale-95 hover:border-teal-300 hover:shadow-md' : 'cursor-default'
                                              } ${
                                                  isSelected
                                                  ? 'border-teal-500 bg-teal-50 shadow-lg ring-2 ring-teal-200 scale-105'
                                                  : 'border-slate-100 bg-slate-50'
                                              } ${
                                                  isDisabled && !isSelected ? 'opacity-40 grayscale' : ''
                                              }`}
                                          >
                                              <span className="text-3xl filter drop-shadow-sm">{opt.icon}</span>
                                              <span className="text-xs font-bold text-slate-700 uppercase tracking-wide">{opt.label}</span>
                                          </button>
                                      );
                                  })}
                              </div>
                          </div>
                      </>
                  )}
                </div>
             );
        }

        function StudentDashboard({ user, firebaseUser }) {
             const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
             const [logData, setLogData] = React.useState({});
             const [isSaving, setIsSaving] = React.useState(false);
             const [isAlreadyFilled, setIsAlreadyFilled] = React.useState(false);

             React.useEffect(() => {
                if (!firebaseUser) return;
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.id}`);
                
                docRef.onSnapshot(
                    snapshot => {
                      const logs = {};
                      snapshot.forEach(doc => logs[doc.id] = doc.data());
                      setLogData(logs);
                      
                      if (logs[date]) {
                          setIsAlreadyFilled(true);
                      } else {
                          setIsAlreadyFilled(false);
                      }
                    },
                    error => {
                        console.error("Firestore Error:", error);
                        if (error.code === 'permission-denied') {
                            alert("Izin Ditolak! \n\nJika ini proyek Anda sendiri, pastikan 'Firestore Security Rules' diatur ke 'Test Mode'.");
                        }
                    }
                );
             }, [firebaseUser, date]);

             const handleSave = async (habitData) => {
                 setIsSaving(true);
                 let points = 0;
                 Object.keys(habitData).forEach(k => { if(habitData[k].status) points++; });
                 const percentage = Math.round((points/7)*100);

                 const dataToSave = {
                     role: 'student',
                     ...habitData, 
                     date, 
                     studentId: user.id, 
                     studentName: user.name, 
                     classId: user.classId, 
                     completionPercentage: percentage
                 };

                 try {
                     await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.id}`).doc(date).set(dataToSave, { merge: true });
                     
                     if (GOOGLE_SHEET_SCRIPT_URL) {
                         await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                             method: 'POST',
                             mode: 'no-cors',
                             headers: {
                                 'Content-Type': 'application/json',
                             },
                             body: JSON.stringify(dataToSave)
                         });
                     }
                     alert("Jurnal berhasil disimpan ke Database!");
                 } catch (error) {
                     alert("Gagal menyimpan data: " + error.message);
                 } finally {
                     setIsSaving(false);
                 }
             };

             return (
                 <div className="space-y-6">
                    <div className="bg-gradient-to-br from-teal-500 via-teal-400 to-yellow-300 rounded-3xl p-8 text-white shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/20 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
                        <div className="absolute bottom-0 left-0 w-32 h-32 bg-yellow-500/30 rounded-full translate-y-1/3 -translate-x-1/3 blur-2xl"></div>
                        
                        <div className="relative z-10">
                            <h2 className="text-3xl font-extrabold mb-2 text-shadow-sm">Halo, {user.name.split(' ')[0]}! 👋</h2>
                            <p className="text-teal-50 text-sm md:text-base font-medium opacity-90 max-w-lg">
                                Siap menjadi Anak Indonesia Hebat hari ini? Yuk, isi jurnalmu dengan jujur!
                            </p>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 w-full md:w-auto">
                            <Icons.Calendar className="text-teal-500"/>
                            <span className="text-sm font-semibold text-slate-600">Tanggal:</span>
                            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="bg-transparent outline-none font-bold text-slate-700 text-sm"/>
                        </div>
                        
                        {isAlreadyFilled && (
                            <div className="flex items-center gap-2 bg-green-50 text-green-700 px-4 py-2 rounded-xl border border-green-200 text-sm font-bold w-full md:w-auto justify-center">
                                <Icons.CheckCircle />
                                <span>Sudah Terisi</span>
                            </div>
                        )}
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-2 md:p-6">
                         <HabitList 
                            initialData={logData[date] || {}} 
                            onSave={handleSave} 
                            isReadOnly={isAlreadyFilled} 
                        />
                    </div>
                    
                    {isSaving && <p className="text-center text-xs text-teal-600 animate-pulse font-semibold">Sedang menyimpan data ke server...</p>}
                 </div>
             )
        }

        function TeacherDashboard({ user, firebaseUser }) {
             const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
             const [classLogs, setClassLogs] = React.useState([]);
             const [selectedStudentForValidation, setSelectedStudentForValidation] = React.useState(null);
             const [isLoading, setIsLoading] = React.useState(false);
             const myStudents = React.useMemo(() => ALL_STUDENTS.filter(s => s.classId === user.classId), [user.classId]);
             
             const fetchLogs = React.useCallback(async () => {
                if (!firebaseUser) return;
                setIsLoading(true);
                const logs = [];
                for (const student of myStudents) {
                    const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${student.id}`).doc(date);
                    try {
                        const doc = await docRef.get();
                        if (doc.exists) {
                            logs.push({ ...doc.data(), studentName: student.name, studentId: student.id });
                        } else {
                            logs.push({ studentName: student.name, studentId: student.id, notFilled: true });
                        }
                    } catch (e) { console.error(e); }
                }
                setClassLogs(logs);
                setIsLoading(false);
             }, [firebaseUser, myStudents, date]);

             React.useEffect(() => {
                fetchLogs();
             }, [fetchLogs]);

             const handleSaveValidation = async (rating) => {
                 if (!selectedStudentForValidation) return;
                 
                 const studentId = selectedStudentForValidation.studentId;
                 const stickerInfo = VALIDATION_OPTIONS.find(v => v.value === rating);
                 
                 const dataToUpdate = {
                     teacherValidation: {
                         rating: rating,
                         sticker: stickerInfo.icon,
                         timestamp: new Date().toISOString(),
                         teacherName: user.name
                     }
                 };

                 await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${studentId}`).doc(date).set(dataToUpdate, { merge: true });
                 
                 if (GOOGLE_SHEET_SCRIPT_URL) {
                     const sheetPayload = {
                         role: 'teacher',
                         date: date,
                         studentName: selectedStudentForValidation.studentName,
                         classId: user.classId,
                         teacherValidation: dataToUpdate.teacherValidation
                     };
                     
                     fetch(GOOGLE_SHEET_SCRIPT_URL, {
                         method: 'POST',
                         mode: 'no-cors',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify(sheetPayload)
                     }).catch(e => console.error("Sheet Error:", e));
                 }

                 setClassLogs(prev => prev.map(log => 
                    log.studentId === studentId 
                    ? { ...log, teacherValidation: { rating: rating, sticker: stickerInfo.icon } }
                    : log
                 ));
                 
                 setSelectedStudentForValidation(null);
                 alert(`Validasi ${stickerInfo.label} diberikan!`);
             };

             return (
                <div className="space-y-6">
                  <div className="bg-gradient-to-br from-teal-700 to-teal-900 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-48 h-48 bg-yellow-300/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-2xl"></div>
                    <div className="relative z-10">
                        <h2 className="text-2xl font-bold mb-1">{user.name}</h2>
                        <div className="flex items-center gap-2 text-teal-100 text-sm">
                            <span className="bg-teal-600 px-2 py-0.5 rounded text-white text-xs font-bold">Wali Kelas {user.classId}</span>
                            <span>•</span>
                            <span>Pemantauan & Validasi Jurnal</span>
                        </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 w-full md:w-auto">
                            <Icons.Calendar className="text-slate-500"/>
                            <span className="text-sm font-semibold text-slate-600 whitespace-nowrap">Tanggal:</span>
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)} 
                                className="bg-transparent outline-none font-bold text-slate-700 text-sm w-full"
                            />
                        </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <Card className="p-6 bg-gradient-to-br from-white to-slate-50 border-none shadow-md">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Total Siswa</h3>
                        <div className="flex items-end gap-2">
                            <p className="text-4xl font-extrabold text-slate-800">{myStudents.length}</p>
                            <span className="text-sm text-slate-500 mb-1 font-medium">Orang</span>
                        </div>
                    </Card>
                    <Card className="p-6 bg-gradient-to-br from-white to-green-50 border-none shadow-md">
                        <h3 className="text-xs font-bold text-green-600 uppercase tracking-wider mb-2">Mengisi Hari Ini</h3>
                        <div className="flex items-end gap-2">
                            <p className="text-4xl font-extrabold text-green-600">
                                {classLogs.filter(l => !l.notFilled).length}
                            </p>
                            <span className="text-sm text-slate-500 mb-1 font-medium">/ {myStudents.length} Siswa</span>
                        </div>
                    </Card>
                  </div>

                  <Card className="overflow-hidden border-0 shadow-lg rounded-3xl bg-white">
                    <div className="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <h3 className="font-bold text-slate-800">Daftar Siswa</h3>
                            <button 
                                onClick={fetchLogs} 
                                disabled={isLoading}
                                className="p-2 hover:bg-white hover:shadow-sm rounded-full transition-all text-teal-600 bg-teal-50"
                                title="Segarkan Data"
                            >
                                <span className={isLoading ? "animate-spin block" : "block"}>
                                    <Icons.Refresh />
                                </span>
                            </button>
                        </div>
                        <span className="text-xs font-bold bg-teal-100 text-teal-700 px-3 py-1 rounded-full">{new Date(date).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div className="divide-y divide-slate-50 max-h-96 overflow-y-auto relative custom-scrollbar">
                        {isLoading && (
                            <div className="absolute inset-0 bg-white/80 z-10 flex items-center justify-center backdrop-blur-sm">
                                <div className="flex flex-col items-center">
                                    <div className="w-8 h-8 border-4 border-teal-200 border-t-teal-600 rounded-full animate-spin mb-2"></div>
                                    <span className="text-sm font-semibold text-slate-500">Memuat Data...</span>
                                </div>
                            </div>
                        )}
                        {classLogs.map((log, idx) => (
                            <div 
                                key={idx} 
                                onClick={() => !log.notFilled && setSelectedStudentForValidation(log)}
                                className={`p-4 flex items-center justify-between transition-all duration-200 group ${!log.notFilled ? 'cursor-pointer hover:bg-teal-50/50' : 'opacity-60 bg-slate-50/50'}`}
                            >
                                <div className="flex items-center gap-3">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold shadow-sm ${!log.notFilled ? 'bg-white text-slate-700 border border-slate-100' : 'bg-slate-200 text-slate-400'}`}>
                                        {idx + 1}
                                    </div>
                                    <div>
                                        <p className="font-bold text-slate-700 text-sm group-hover:text-teal-700 transition-colors">{log.studentName}</p>
                                        <div className="flex gap-2 mt-1 items-center">
                                            {!log.notFilled ? (
                                                <>
                                                    {log.teacherValidation ? (
                                                        <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full flex items-center gap-1 border border-green-200 font-bold">
                                                            {log.teacherValidation.sticker} Terverifikasi

                                                    ) : (
                                                        <span className="text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full border border-yellow-200 font-bold animate-pulse">
                                                            Perlu Validasi
                                                        </span>
                                                    )}
                                                </>
                                            ) : (
                                                <span className="text-[10px] text-red-400 italic font-medium">Belum mengisi</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div>
                                     {!log.notFilled && (
                                        <div className="text-right">
                                            <span className="block font-bold text-lg text-teal-600">{log.completionPercentage}%</span>
                                            <Icons.ChevronDown className="ml-auto text-slate-300 w-4 h-4 group-hover:text-teal-400 transition-colors"/>
                                        </div>
                                     )}
                                </div>
                            </div>
                        ))}
                    </div>
                  </Card>

                  {selectedStudentForValidation && (
                      <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-[100] p-4 animate-fade-in-up backdrop-blur-sm">
                          <div className="bg-white w-full max-w-lg rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                              <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                  <div>
                                      <h3 className="font-extrabold text-lg text-slate-800">{selectedStudentForValidation.studentName}</h3>
                                      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Jurnal Tanggal {date}</p>
                                  </div>
                                  <button onClick={() => setSelectedStudentForValidation(null)} className="p-2 hover:bg-white hover:shadow rounded-full transition-all text-slate-400 hover:text-red-500">
                                      <Icons.Close />
                                  </button>
                              </div>
                              
                              <div className="p-5 overflow-y-auto flex-1 custom-scrollbar bg-white">
                                  <HabitList initialData={selectedStudentForValidation} isReadOnly={true} />
                              </div>

                              <div className="p-6 border-t border-slate-100 bg-slate-50">
                                  <p className="text-sm font-bold text-slate-600 mb-4 text-center uppercase tracking-wide">Berikan Validasi & Stiker</p>
                                  <div className="grid grid-cols-2 gap-3">
                                      {VALIDATION_OPTIONS.map((opt) => (
                                          <button
                                              key={opt.value}
                                              onClick={() => handleSaveValidation(opt.value)}
                                              className={`p-4 rounded-2xl border-2 flex flex-col items-center gap-2 transition-all active:scale-95 hover:shadow-md ${
                                                  selectedStudentForValidation.teacherValidation?.rating === opt.value
                                                  ? 'border-teal-500 bg-teal-50 shadow-inner ring-2 ring-teal-200'
                                                  : 'border-white bg-white hover:border-teal-100'
                                              }`}
                                          >
                                              <span className="text-3xl filter drop-shadow-sm">{opt.icon}</span>
                                              <span className="text-xs font-bold text-slate-700">{opt.label}</span>
                                          </button>
                                      ))}
                                  </div>
                              </div>
                          </div>
                      </div>
                  )}
                </div>
             );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
